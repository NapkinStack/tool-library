# Machine-readable source of truth for the module.
# Read by: humans (onboarding), agents (scoping), CI (fitness functions).
# Any divergence between this file and the code fails CI.

module:
  name: "catalog"

  # ONE sentence. If it needs an "and", the module probably does two things.
  responsibility: >
    Holds the tools a neighbour is willing to lend in their neighbourhood.

  owner: "NapkinStack/catalog"
  contact: "@NapkinStack/catalog"

  # proposed | active | maintenance | deprecated | retired   (docs/os/02-modules.md §6)
  lifecycle: proposed

  # prototype | standard | high | critical              (docs/os/07-governance.md §6)
  criticality: "standard"

  # Does a user see this module? true requires a test sheet on its pull requests
  # (docs/os/05-workflow.md §7). Raised by D2, the deliverable that puts a page in front of a
  # neighbour, in the same pull request whose test sheet proves it — the manifest describes
  # what is. Lowering it again is impossible: T1 reads the stricter of base and head.
  user_facing: true

# Contracts PROVIDED by this module.
# Declared by deliverable D1, in the same pull request as the document it points at: the
# declared graph must equal the real one. v1 is never edited once merged; a breaking
# change creates v2 beside it (charter, C2).
provides:
  - contract: catalog-api
    version: v1
    path: contracts/catalog-api/v1
    stability: experimental      # experimental | stable | deprecated
    # experimental: nothing is deployed and no consumer has migrated yet. loans declares
    # it under consumes with D3, the first pull request that reads it.

# Contracts CONSUMED - this is the DECLARED graph.
# CI compares it with the REAL graph extracted from the code: any gap is a violation.
consumes: []

# Data owned. Nobody else accesses it directly.
data:
  owns:
    - "The tools listed in a neighbourhood: what the tool is, who lends it, roughly where"
  # One SQLite file per module (charter, C2), written where the run verb is told to put it.
  # Never committed: modules/catalog/.gitignore.
  shared: []                     # any exception requires a named ADR

# Significant external dependencies.
dependencies: []

# Standard verbs: the same names everywhere, running this module's stack commands
# (docs/os/09-platform.md §2). The stack is the charter's constraint C2.
# Sources are named rather than walking ".": a tool that walks the folder also walks
# whatever a workstation leaves in it.
commands:
  check: "uvx --from ruff==0.16.8 ruff format --check src tests e2e && uvx --from ruff==0.16.8 ruff check src tests e2e"
  test: "uv run --locked --group test pytest"
  # D1's scenarios read the contract and call the double built from it; D2's drive this
  # module - the page in a browser at a phone's width, and the contract answered by the
  # module itself. Playwright is the charter's e2e driver (C2); the browser arrives with D2,
  # and bootstrap downloads it.
  e2e: "uv run --locked --group e2e pytest e2e"
  # Playwright's browser, installed as a package and never as an action (charter, C2). CI
  # runs this before check, test and e2e; a workstation runs it once per clone.
  bootstrap: "uv run --locked --group e2e playwright install chromium"
  # The page, on its own SQLite file. PYTHONPATH because this project declares no
  # [build-system], so uv never puts src/ on sys.path - see AGENTS.md, known traps.
  run: "PYTHONPATH=src uv run --locked python -m catalog.app"

# Review budget. Inherited from the project when absent (docs/os/05-workflow.md §4).
review_budget:
  max_lines: 400
  max_files: 15
  max_modules: 1                 # not adjustable

docs:
  readme: README.md
  agents: AGENTS.md
  adr: docs/adr/
