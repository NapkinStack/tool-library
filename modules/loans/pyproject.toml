# The module's own tooling. The project's stack is fixed by the charter, constraint C2.
# uv is the only prerequisite: every command below runs from this folder through it.

[project]
name = "loans"
version = "0.1.0"
description = "Who holds which tool, between which dates, and what came back."
requires-python = ">=3.13"
# Pinned, because a page verified at a 375-pixel-wide viewport is only evidence if the
# same versions answer in CI and on a workstation. Their exit strategies are in the
# MANIFEST; the stack itself is the charter's C2, not this module's choice.
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "uvicorn==0.53.0",
]

# What the test and e2e verbs need, and the page does not. Pinned, and resolved in uv.lock
# with everything else: `uv run --with` would resolve outside the lock, where what the pins
# pull in floats.
[dependency-groups]
test = [
    "pytest==8.4.2",
    "jsonschema==4.26.0",           # the consumer side: responses checked against the contract's schemas
]
e2e = [
    "pytest==8.4.2",
    "playwright==1.63.0",           # the charter's e2e driver (C2)
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
