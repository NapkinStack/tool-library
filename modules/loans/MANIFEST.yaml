# Machine-readable source of truth for the module.
# Read by: humans (onboarding), agents (scoping), CI (fitness functions).
# Any divergence between this file and the code fails CI.

module:
  name: "loans"

  # ONE sentence. If it needs an "and", the module probably does two things.
  responsibility: >
    Records who holds a listed tool, from the day it is handed over to the day it comes
    back.

  owner: "NapkinStack/loans"          # a GitHub team, organisation/team; a user only without an organisation
  contact: "@NapkinStack/loans"

  # proposed | active | maintenance | deprecated | retired   (docs/os/02-modules.md §6)
  lifecycle: proposed

  # prototype | standard | high | critical              (docs/os/07-governance.md §6)
  criticality: "standard"

  # Does a user see this module? true requires a test sheet on its pull requests
  # (docs/os/05-workflow.md §7). Raised by deliverable D3, in the pull request that puts the
  # page in front of a neighbour — the same pull request whose test sheet proves it. From
  # here on every pull request touching this module carries a sheet, and none can lower the
  # flag back: T1 reads the stricter of base and head.
  user_facing: true

  # The module's name in the code, when it differs from the folder (package, namespace).
  # Used by boundary detection.
  # code_name: loans

  # Only when lifecycle = deprecated. The check turns red once the date has passed.
  # deprecation:
  #   replaced_by:
  #   removal_date: YYYY-MM-DD

# Contracts PROVIDED by this module.
provides: []
#  - contract: loans-api
#    version: v1
#    path: contracts/loans-api/v1
#    stability: experimental      # experimental | stable | deprecated
#    # removal_date: YYYY-MM-DD   # required when stability = deprecated

# Contracts CONSUMED - this is the DECLARED graph.
# CI compares it with the REAL graph extracted from the code: any gap is a violation.
# Declared by deliverable D3, the pull request that first reads the contract. This module
# reads catalog-api v1 as a DOCUMENT - src/loans/contract.py loads
# contracts/catalog-api/v1/openapi.yaml - and never as a package: it imports nothing of
# catalog and starts nothing of it. B4's detection looks for the other module's name in an
# import line, so it reports this dependency as unused; it is used, by the only route a
# contract is allowed to be used by (see README, "Contracts").
consumes:
  - contract: catalog-api
    version: v1
    module: catalog

# Data owned. Nobody else accesses it directly.
data:
  owns:
    - "Loans: which tool, held by whom, between which dates, and whether it came back"
  shared: []                     # any exception requires a named ADR

# Significant external dependencies.
# Each one declares its exit strategy (docs/os/06-decisions.md §3).
# None of these is this module's choice: the stack is the charter's constraint C2, decided
# for the project with the Prior Art Gate applied. Versions are pinned in pyproject.toml.
dependencies:
  - name: fastapi
    purpose: "The page a neighbour opens, server-rendered, and the double's HTTP surface"
    adr: "docs/project/charter.md (C2 - the stack)"
    exit_strategy: "Any ASGI framework: the routes are four, and no FastAPI type reaches
      the domain in src/loans/records.py"
  - name: jinja2
    purpose: "The one HTML template the page renders"
    adr: "docs/project/charter.md (C2 - the stack)"
    exit_strategy: "One template, no macro, no filter of our own: any template engine"
  - name: python-multipart
    purpose: "Reading the loan form, as FastAPI requires for form data"
    adr: "docs/project/charter.md (C2 - the stack)"
    exit_strategy: "Required by FastAPI for forms; it leaves with FastAPI"
  - name: httpx
    purpose: "Speaking catalog-api v1, over the network or to the double in-process"
    adr: "docs/project/charter.md (C2 - the stack)"
    exit_strategy: "Any HTTP client: the contract is four fields and two operations, behind
      src/loans/catalogue.py"
  - name: pyyaml
    purpose: "Reading contracts/catalog-api/v1/openapi.yaml, the contract document"
    adr: "docs/project/charter.md (C2 - the stack)"
    exit_strategy: "Any YAML reader; the document is read in one place, src/loans/contract.py"
  - name: uvicorn
    purpose: "Serving the page, locally and for the e2e scenarios"
    adr: "docs/project/charter.md (C2 - the stack)"
    exit_strategy: "Any ASGI server: nothing imports uvicorn outside e2e/conftest.py"

# Standard verbs: the same names everywhere, running this module's stack commands
# (docs/os/09-platform.md §2). `nstack <verb> <module>` runs them from this folder.
# No stack is imposed: replace every "to be declared" command.
# The stack is the charter's constraint C2. Sources are named rather than walking ".":
# a tool that walks the folder also walks whatever a workstation leaves in it.
commands:
  check: "uvx --from ruff==0.16.8 ruff format --check src tests e2e && uvx --from ruff==0.16.8 ruff check src tests e2e"
  test: "uv run --locked --group test pytest"    # NEVER starts another module
  # D3's scenarios, in a browser at a 375-pixel-wide viewport. It starts the page itself
  # and answers the catalogue with the double built from the contract: no other module is
  # started, none is installed. The browser is installed as a package, never as an action
  # (charter, C2.3), and its download is never a reason to skip e2e.
  e2e: >-
    uv run --locked --group e2e playwright install chromium &&
    uv run --locked --group e2e pytest e2e
  # bootstrap:                   # optional: make the module usable from a fresh clone
  # run:                         # optional: local start, with doubles for the dependencies

# Review budget. Inherited from the project when absent (docs/os/05-workflow.md §4).
review_budget:
  max_lines: 400
  max_files: 15
  max_modules: 1                 # not adjustable

docs:
  readme: README.md
  agents: AGENTS.md
  adr: docs/adr/
  # runbook: docs/runbook.md     # required when criticality >= high
